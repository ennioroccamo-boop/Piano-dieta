<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Diagnosi Modelli Gemini</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 30px; background-color: #f0f4f8; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background-color: #1557b0; }
        #log { margin-top: 20px; padding: 15px; background: #202124; color: #34a853; border-radius: 6px; font-family: monospace; white-space: pre-wrap; overflow-x: auto; min-height: 100px; }
        .error { color: #ea4335 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Analisi Professionale Permessi API</h2>
    <p>Inserisci la chiave <b>...</b> per verificare quali modelli sono realmente attivi per te.</p>

    <input type="password" id="apiKey" placeholder="Incolla qui la chiave API">
    <button onclick="eseguiDiagnosi()">Avvia Analisi Modelli</button>

    <div id="log">I risultati appariranno qui dopo l'analisi...</div>
</div>

<script>
async function eseguiDiagnosi() {
    const key = document.getElementById('apiKey').value.trim();
    const log = document.getElementById('log');

    if(!key) { alert("Inserisci la chiave!"); return; }

    log.innerText = "Interrogazione server Google in corso...\n";
    log.classList.remove("error");

    const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${key}`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
            log.classList.add("error");
            log.innerText = "ERRORE SERVER (" + response.status + "):\n" + JSON.stringify(data, null, 2);
            return;
        }

        if (data.models && data.models.length > 0) {
            let modelliLista = data.models.map(m => "- " + m.name.replace('models/', '')).join('\n');
            log.innerText = "SUCCESSO! Modelli trovati per la tua chiave:\n\n" + modelliLista;
        } else {
            log.classList.add("error");
            log.innerText = "ATTENZIONE: La chiave è valida ma non ha modelli associati.\nRisposta completa:\n" + JSON.stringify(data, null, 2);
        }
    } catch (e) {
        log.classList.add("error");
        log.innerText = "ERRORE DI RETE:\n" + e.message;
    }
}
</script>

</body>
</html>
