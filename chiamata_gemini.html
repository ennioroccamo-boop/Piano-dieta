<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gemini API - Risolto</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; cursor: pointer; font-weight: bold; }
        #res { margin-top: 20px; padding: 15px; background: #e8f0fe; border-left: 5px solid #1a73e8; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="card">
    <h2>Gemini 2.5 Flash Test</h2>
    <input type="password" id="key" placeholder="Incolla la chiave ..">
    <textarea id="prompt" placeholder="Chiedi qualcosa..."></textarea>
    <button onclick="chiamaAI()">Invia Richiesta</button>
    <div id="res"></div>
</div>

<script>
async function chiamaAI() {
    const key = document.getElementById('key').value.trim();
    const prompt = document.getElementById('prompt').value.trim();
    const resDiv = document.getElementById('res');

    resDiv.style.display = "block";
    resDiv.innerText = "In attesa di risposta...";

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
        });

        const data = await response.json();

        if (data.error) {
            resDiv.innerText = "Errore: " + data.error.message;
        } else {
            resDiv.innerText = data.candidates[0].content.parts[0].text;
        }
    } catch (e) {
        resDiv.innerText = "Errore di connessione: " + e.message;
    }
}
</script>
</body>
</html>
